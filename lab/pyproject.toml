[project]
name = "lab"
version = "0.1.0"
description = "Tests lab-engine candidates through the SPRT runner and keeps the ledger"
requires-python = ">=3.13"
dependencies = [
    "pydantic==2.14.3",
    "shared",
    "typer==0.28.0",
]

[project.scripts]
lab = "lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.uv.sources]
shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
]
