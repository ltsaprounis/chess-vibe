[project]
name = "random-engine"
version = "0.1.0"
description = "Random move chess engine for testing"
requires-python = ">=3.13"
dependencies = [
    "chess==1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/random_engine"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
]
