[project]
name = "lab-engine"
version = "0.1.0"
description = "Baseline Python chess engine for the autoresearch loop"
requires-python = ">=3.13"
dependencies = [
    "numba==0.68.1",
    "numpy==2.5.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_engine"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# numba ships no type information. The stubs here declare the few parts of
# its API the engine and its tests use.
stubPath = "typings"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "pyright==1.1.408",
    "pytest==9.0.2",
    "pytest-cov==7.0.0",
]
